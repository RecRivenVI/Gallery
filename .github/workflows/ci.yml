name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 契约生成、静态检查、纯 Go 测试和构建
        shell: pwsh
        run: ./scripts/Check.ps1
      - name: Race detector
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/Check.ps1 -Race
      # govulncheck 必须先安装再调用，不能沿用 `go run ...@version`：`go run` 会按当前 GOOS
      # 构建工具本身，因此在 Linux runner 上做 GOOS=windows 扫描时，`go run` 产出的是一个
      # Windows 可执行文件，根本无法在 runner 上执行。安装一次（宿主平台），随后只改变
      # **被扫描目标**的 GOOS，是唯一正确的做法。
      - name: 安装 govulncheck
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # 扫描范围用 `./...` 而不是逐个顶层目录：显式清单需要人工维护，任何新增顶层 Go 目录
      # 都会静默落在扫描之外。`./...` 覆盖主模块的全部包，包括 web/node_modules 下随 npm
      # 依赖分发、且确实被 `go vet ./...`/`go test ./...` 编译的 Go 包。
      - name: 依赖漏洞扫描（Linux 调用图）
        if: runner.os == 'Linux'
        run: govulncheck ./...
      # 可达性分析按当前 GOOS 构建调用图。只扫 Linux 会让 `free_windows.go` 与全部
      # `golang.org/x/sys/windows` 调用图完全不在分析范围内——而 Windows 11 x64 才是 v1 的
      # 正式目标平台。扫描目标平台与 runner 操作系统无关（govulncheck 只做类型检查与 SSA
      # 分析，不执行被扫描代码），因此这一次在同一个 Linux runner 上完成，不额外占用
      # Windows runner 时间。
      - name: 依赖漏洞扫描（Windows 调用图）
        if: runner.os == 'Linux'
        env:
          GOOS: windows
          GOARCH: amd64
        run: govulncheck ./...
      # Test-Bench 下的两个 cleanroom 实验台是**独立 Go module**，`./...` 在仓库根不会进入
      # 它们，必须逐个 module 调用。它们不进入正式发行，但仍被 CI 之外的人工流程实际构建与
      # 运行，因此按 AGENTS.md「依赖安全」的要求不得仅凭目录名判定其依赖告警可以忽略。
      - name: 依赖漏洞扫描（Test-Bench 独立模块）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for module in Test-Bench/cleanroom-lab Test-Bench/cleanroom-lab-real; do
            echo "::group::govulncheck $module"
            (cd "$module" && govulncheck ./...)
            echo "::endgroup::"
          done

  web-browser:
    name: Web 浏览器 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装与构建 Web
        working-directory: web
        run: npm ci && npm run build
      - name: 安装 Chromium 与 Firefox
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: 执行浏览器 smoke
        working-directory: web
        run: npm run test:smoke
      - name: 执行隔离 Chromium 与 Firefox 真实后端业务 E2E
        working-directory: web
        run: |
          npm run test:real:bootstrap
          npm run test:real:bootstrap -- -browser-project firefox
      - name: 保存真实后端失败诊断
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-real-backend-diagnostics
          path: |
            web/test-results/real-backend/galleryd*.log
            web/test-results/**/*.png
            web/test-results/**/*.webm
          if-no-files-found: warn
          retention-days: 7

  windows-portable:
    name: Windows 便携包 smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装固定版本 CycloneDX Go 工具
        shell: pwsh
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: 构建并验证未签名便携包
        shell: pwsh
        run: |
          $previousVersion = '0.0.0-ci.${{ github.run_number }}.0+${{ github.sha }}'
          $version = '0.0.0-ci.${{ github.run_number }}.1+${{ github.sha }}'
          $tool = Join-Path (& go env GOPATH) 'bin\cyclonedx-gomod.exe'
          $output = Join-Path $env:RUNNER_TEMP 'gallery-portable'
          $currentOutput = Join-Path $output 'current'
          $previousOutput = Join-Path $output 'previous'
          ./scripts/Build-WindowsPortable.ps1 -Version $version -OutputDirectory $currentOutput -CycloneDXGoModExecutable $tool
          ./scripts/Build-WindowsPortable.ps1 -Version $previousVersion -OutputDirectory $previousOutput -CycloneDXGoModExecutable $tool -SkipWebBuild
          $currentArchives = @(Get-ChildItem -LiteralPath $currentOutput -Filter '*.zip' -File)
          $previousArchives = @(Get-ChildItem -LiteralPath $previousOutput -Filter '*.zip' -File)
          if ($currentArchives.Count -ne 1 -or $previousArchives.Count -ne 1) {
            throw "预期两个版本各一个 ZIP，实际 current=$($currentArchives.Count) previous=$($previousArchives.Count)"
          }
          $probe = Join-Path $output 'portable-upgrade.exe'
          go build -trimpath -o $probe ./tools/testlab/cmd/portable-upgrade
          if ($LASTEXITCODE -ne 0) { throw "构建版本切换 probe 失败，退出码 $LASTEXITCODE" }
          ./scripts/Test-WindowsPortableUpgrade.ps1 `
            -PreviousArchivePath $previousArchives[0].FullName `
            -CurrentArchivePath $currentArchives[0].FullName `
            -PreviousVersion $previousVersion `
            -CurrentVersion $version `
            -UpgradeProbeExecutable $probe
      - name: 验证真实历史 Schema 支持矩阵与降级拒绝
        shell: pwsh
        run: ./scripts/Test-WindowsHistoricalUpgrade.ps1
